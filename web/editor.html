<!doctype html><html lang="zh-Hant-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教師整理工具｜文學佳作</title><link rel="stylesheet" href="style.css"><script defer src="data.js"></script><script defer src="editor.js"></script></head><body><header><a class="brand" href="index.html">文學佳作<span>閱讀與寫作</span></a><nav><a href="index.html">返回文章庫</a></nav></header><main><section class="editor"><h1>教師整理工具</h1><p>在此新增文章，或載入現有文章檔修改分數及評語。所有操作在你的瀏覽器內完成，不會呼叫 AI。下載後上傳到 GitHub 的 <code>content</code> 資料夾，提交修改便會自動更新網站；下載本身不會更新網站。</p><label class="field"><span>選擇現有文章，修改分數或評語</span><select id="existing"><option value="">請選擇文章…</option></select></label><p><a href="https://github.com/chiencl/literature-library/upload/main/content" target="_blank" rel="noopener">上傳文章檔到 GitHub →</a></p><label class="field"><span>載入現有 Markdown 文章檔（.md）</span><input type="file" id="load" accept=".md"></label><form id="edit-form"><div class="form-grid"><label class="field"><span>作文題目 *</span><input id="topic" required placeholder="例如：難以下嚥的盛宴"></label><label class="field"><span>閱讀辨識名稱 *</span><input id="label" required placeholder="例如：父母老去與遲來的體諒"></label><label class="field"><span>文章代號 *（英文字母、數字、連字號）</span><input id="id" required pattern="[a-z0-9][a-z0-9-]*" placeholder="例如：new-topic-01"></label><label class="field"><span>原文來源</span><input id="source" placeholder="例如：佳作集.docx"></label><label class="field"><span>教師分數（留空顯示未評分）</span><input id="score" type="number" min="0" step="any"></label><label class="field"><span>滿分（可留空）</span><input id="scoreMax" type="number" min="0.01" step="any"></label></div><label class="field"><span>內容大意</span><textarea id="summary"></textarea></label><label class="field"><span>值得學習之處（每行一項）</span><textarea id="learn"></textarea></label><label class="field"><span>有待改善之處（每行一項）</span><textarea id="improve"></textarea></label><label class="field"><span>評語來源 *</span><input id="reviewSource" required value="教師評語"></label><label class="field"><span>佳作全文 *（以空白行分段，建置時自動轉繁體）</span><textarea id="body" required></textarea></label><div class="editor-actions"><button class="primary" type="submit">下載文章檔</button><button class="secondary" type="reset">清空表格</button></div><p id="status" class="message" role="status"></p></form><hr><h2>大量文章如何加入？</h2><p>使用附帶的 Word 匯入工具，先核對分篇位置；已經整理好的文章毋須再由 AI 處理。將下載的同代號檔案覆蓋原檔便可更新教師分數；新文章請使用新代號。同一作文題目會自動歸在一起。</p></section></main><footer>文學佳作<span>文章與評語獨立保存</span></footer></body></html>
